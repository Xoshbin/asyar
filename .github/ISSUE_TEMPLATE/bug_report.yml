name: Bug Report
description: Report a bug or issue with Asyar
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Asyar Version
      description: What version of Asyar are you running? (e.g., v0.1.1-38)
      placeholder: 'v1.x.x'
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / OS
      description: Which operating system are you using?
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Additional Context
      description: Paste any error messages, terminal logs, or extra details here.
      render: shell
    validations:
      required: false
