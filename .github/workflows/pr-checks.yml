name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-description:
    name: PR description & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/files" --paginate --jq '.[].filename' > "${RUNNER_TEMP}/changed-files.txt"

      - name: Validate PR description
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: node scripts/check-pr.mjs --event "$GITHUB_EVENT_PATH" --files "${RUNNER_TEMP}/changed-files.txt" --exempt-login "$REPO_OWNER"
