[package]
name = "asyar-calculator"
version = "0.1.0"
description = "Natural-language calculator, unit converter, and currency engine for Asyar."
authors = ["Khoshbin Ali <xoshbin@gmail.com>"]
license = "GPL-3.0-only"
edition = "2021"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
fend-core = "1.5.8"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "2.0.0-rc.23", features = ["derive"] }
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.0", features = ["full"] }
