[package]
name = "asyar-storage"
version = "0.1.0"
description = "Pooled SQLite engine, schema migrations, and repositories for Asyar."
authors = ["Khoshbin Ali <xoshbin@gmail.com>"]
license = "GPL-3.0-only"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
specta = { version = "2.0.0-rc.23", features = ["derive", "collect", "serde_json"] }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.10"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tempfile = "3.10"
