<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#431407" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#F97316"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<g filter="url(#shadow)">
    <!-- Modern Calculator Body (Porcelain White) -->
    <rect x="146" y="126" width="220" height="270" rx="28" fill="#FFFFFF"/>

    <!-- LED Display Screen -->
    <rect x="170" y="150" width="172" height="54" rx="12" fill="#18181B"/>
    <text x="326" y="188" font-family="ui-monospace, SFMono-Regular, monospace" font-size="28" font-weight="bold" fill="#34D399" text-anchor="end">42</text>

    <!-- Keypad Grid (4 buttons: +, -, ×, =) -->
    <!-- Row 1 -->
    <rect x="170" y="222" width="76" height="66" rx="14" fill="#FED7AA"/>
    <text x="208" y="266" font-family="-apple-system, sans-serif" font-size="34" font-weight="bold" fill="#9A3412" text-anchor="middle">+</text>

    <rect x="266" y="222" width="76" height="66" rx="14" fill="#FED7AA"/>
    <text x="304" y="266" font-family="-apple-system, sans-serif" font-size="34" font-weight="bold" fill="#9A3412" text-anchor="middle">−</text>

    <!-- Row 2 -->
    <rect x="170" y="306" width="76" height="66" rx="14" fill="#FED7AA"/>
    <text x="208" y="350" font-family="-apple-system, sans-serif" font-size="32" font-weight="bold" fill="#9A3412" text-anchor="middle">×</text>

    <rect x="266" y="306" width="76" height="66" rx="14" fill="#F97316"/>
    <text x="304" y="350" font-family="-apple-system, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">=</text>
  </g>
  </g>
</svg>
