<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="45%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <radialGradient id="topSheen" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#022C22" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#topSheen)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- Main White Clipboard Card (Large & Bold, filling ~74% of squircle) -->
    <rect x="96" y="98" width="320" height="330" rx="26" fill="#FFFFFF"/>

    <!-- Top Metallic Clip -->
    <rect x="176" y="72" width="160" height="52" rx="12" fill="#E2E8F0" stroke="#0F766E" stroke-width="4"/>
    <rect x="216" y="84" width="80" height="14" rx="7" fill="#0D9488"/>

    <!-- 3 Rich List Item Rows with Bullets & Bars -->
    <!-- Row 1 -->
    <circle cx="145" cy="180" r="12" fill="#0D9488"/>
    <rect x="175" y="172" width="195" height="16" rx="8" fill="#CBD5E1"/>

    <!-- Row 2 -->
    <circle cx="145" cy="245" r="12" fill="#14B8A6"/>
    <rect x="175" y="237" width="195" height="16" rx="8" fill="#E2E8F0"/>

    <!-- Row 3 -->
    <circle cx="145" cy="310" r="12" fill="#2DD4BF"/>
    <rect x="175" y="302" width="145" height="16" rx="8" fill="#E2E8F0"/>
  </g>
</svg>
