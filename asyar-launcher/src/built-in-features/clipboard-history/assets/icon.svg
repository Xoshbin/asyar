<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <!-- Crisp Specular Rim for Squircle Edge Definition -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Tight, Punchy Card Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#022C22" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#022C22" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Solid Flat Teal Squircle (No muddy or desaturating gradient) -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#0D9488"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g filter="url(#cardShadow)">
    <!-- Solid Crisp White Document Sheet (Sweet-spot: width 276, height 286, rx=22) -->
    <rect x="118" y="112" width="276" height="286" rx="22" fill="#FFFFFF"/>

    <!-- Distinctive Tech Clamp (Dark Charcoal/Obsidian with Cyan Accent) -->
    <!-- Outer Clamp Body -->
    <rect x="184" y="84" width="144" height="46" rx="11" fill="#1E293B"/>
    <!-- Subtle metallic rim on clamp -->
    <rect x="185" y="85" width="142" height="44" rx="10" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Asyar Cyan Accent Bar (Gives it unique brand identity & pops at 24px) -->
    <rect x="220" y="97" width="72" height="12" rx="6" fill="#2DD4BF"/>

    <!-- High-Contrast Rich Clipboard Content Rows -->
    <!-- Row 1: Tag/Pill + Bold Header Line -->
    <rect x="150" y="168" width="38" height="18" rx="9" fill="#0D9488"/>
    <rect x="198" y="168" width="162" height="18" rx="9" fill="#0F172A"/>

    <!-- Row 2: Circular Bullet + Body Text Line -->
    <circle cx="166" cy="234" r="10" fill="#14B8A6"/>
    <rect x="198" y="225" width="162" height="18" rx="9" fill="#334155"/>

    <!-- Row 3: Indented Detail Line (Truncated preview) -->
    <rect x="198" y="282" width="116" height="18" rx="9" fill="#64748B"/>
  </g>
</svg>
