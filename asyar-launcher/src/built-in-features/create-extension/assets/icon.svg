<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<!-- Background Gradient -->
    

    <!-- Specular Rim Gradient -->
    

    <!-- Top Ambient Sheen -->
    

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#1E293B"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<!-- Hero Illustration -->
  
      <!-- Interlocking Extension Block -->
      <g filter="url(#drop)">
        <!-- 3D Isometric Cube / Puzzle Block -->
        <!-- Top Face -->
        <polygon points="256,136 366,196 256,256 146,196" fill="#3B82F6" stroke="#93C5FD" stroke-width="2"/>
        <!-- Left Face -->
        <polygon points="146,196 256,256 256,376 146,316" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2"/>
        <!-- Right Face -->
        <polygon points="256,256 366,196 366,316 256,376" fill="#1E40AF" stroke="#93C5FD" stroke-width="2"/>
        <!-- Plug Tab connector protruding on top -->
        <polygon points="256,160 286,176 256,192 226,176" fill="#60A5FA"/>
        <!-- Code syntax brackets inscribed on front -->
        <path d="M 216 270 L 196 286 L 216 302" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 296 270 L 316 286 L 296 302" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="262" y1="266" x2="250" y2="306" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
      </g>
