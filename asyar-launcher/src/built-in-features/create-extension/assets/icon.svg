<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B355A"/>
      <stop offset="100%" stop-color="#0B1728"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E3A8A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
  </defs>

  <!-- Continuous Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>

  <!-- Top Sheen Layer -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- Specular 1px Inner Bevel -->
  <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" stroke="url(#rim)" stroke-width="1.5" fill="none"/>
  <g transform="translate(-107.520 -107.520) scale(1.42)">
<!-- Hero Illustration -->
  
      <!-- Interlocking Extension Block -->
      <g filter="url(#drop)">
        <!-- 3D Isometric Cube / Puzzle Block -->
        <!-- Top Face -->
        <polygon points="256,136 366,196 256,256 146,196" fill="#3B82F6" stroke="#93C5FD" stroke-width="2"/>
        <!-- Left Face -->
        <polygon points="146,196 256,256 256,376 146,316" fill="#1D4ED8" stroke="#93C5FD" stroke-width="2"/>
        <!-- Right Face -->
        <polygon points="256,256 366,196 366,316 256,376" fill="#1E40AF" stroke="#93C5FD" stroke-width="2"/>
        <!-- Plug Tab connector protruding on top -->
        <polygon points="256,160 286,176 256,192 226,176" fill="#60A5FA"/>
        <!-- Code syntax brackets inscribed on front -->
        <path d="M 216 270 L 196 286 L 216 302" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 296 270 L 316 286 L 296 302" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="262" y1="266" x2="250" y2="306" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>
      </g>
  </g>
</svg>