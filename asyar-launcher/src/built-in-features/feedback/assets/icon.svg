<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4365"/>
      <stop offset="100%" stop-color="#99002A"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA3B5" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#800020" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#800020" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
  </defs>

  <!-- Continuous Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>

  <!-- Top Sheen Layer -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- Specular 1px Inner Bevel -->
  <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" stroke="url(#rim)" stroke-width="1.5" fill="none"/>
  <g transform="translate(-107.520 -107.520) scale(1.42)">
<!-- Hero Illustration -->
  
      <!-- Flight Speed Lines -->
      <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-dasharray="10 8" stroke-width="3">
        <path d="M 120 380 Q 190 350 250 300" />
        <path d="M 100 410 Q 180 390 260 340" />
      </g>
      <!-- Paper Airplane -->
      <g filter="url(#drop)">
        <!-- Main Wings Body -->
        <polygon points="380,132 140,250 236,290 380,132" fill="#FFFFFF"/>
        <!-- Right Wing Underfold -->
        <polygon points="380,132 236,290 276,368 380,132" fill="#E2E8F0"/>
        <!-- Bottom Fin / Keel -->
        <polygon points="236,290 276,368 252,320 236,290" fill="#CBD5E1"/>
        <!-- Top Shading Fold -->
        <polygon points="380,132 140,250 260,240 380,132" fill="#F8FAFC" opacity="0.9"/>
      </g>
      <!-- Sparkle Stars -->
      <path d="M 380 230 Q 380 242 392 242 Q 380 242 380 254 Q 380 242 368 242 Q 380 242 380 230 Z" fill="#FFE3EC"/>
      <circle cx="160" cy="180" r="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>