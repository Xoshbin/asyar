<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#451A03" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#F59E0B"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(40.96 40.96) scale(0.84)">
<g filter="url(#shadow)">
    <!-- Folder Back Tab -->
    <path d="M 90, 155 C 90, 140 102, 128 118, 128 L 200, 128 C 214, 128 226, 136 233, 148 L 248, 172 L 394, 172 C 410, 172 422, 184 422, 200 L 422, 375 C 422, 391 410, 403 394, 403 L 118, 403 C 102, 403 90, 391 90, 375 Z"
          fill="#FDE68A"/>

    <!-- Document Inside Folder -->
    <rect x="136" y="150" width="240" height="180" rx="16" fill="#FFFFFF"/>
    <rect x="165" y="180" width="120" height="12" rx="6" fill="#1E293B"/>
    <rect x="165" y="206" width="150" height="12" rx="6" fill="#475569"/>

    <!-- Folder Front Flap -->
    <path d="M 90, 215 C 90, 199 102, 187 118, 187 L 394, 187 C 410, 187 422, 199 422, 215 L 422, 375 C 422, 391 410, 403 394, 403 L 118, 403 C 102, 403 90, 391 90, 375 Z"
          fill="#F59E0B"/>

    <!-- Bold Magnifying Glass with Glass Sheen & Thick Handle -->
    <circle cx="295" cy="295" r="56" fill="#EFF6FF" fill-opacity="0.9" stroke="#1E293B" stroke-width="10"/>
    <circle cx="295" cy="295" r="44" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6"/>
    <line x1="336" y1="336" x2="396" y2="396" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
  </g>
</g>
</svg>
