<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<!-- Background Gradient -->
    

    <!-- Specular Rim Gradient -->
    

    <!-- Top Ambient Sheen -->
    

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#6366F1"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<!-- Hero Illustration -->
  
      <!-- Rackmount Blades -->
      <g filter="url(#drop)">
        <!-- Blade 1 (Top) -->
        <rect x="126" y="146" width="260" height="54" rx="14" fill="#241242" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.6"/>
        <circle cx="156" cy="173" r="5" fill="#10B981"/>
        <circle cx="174" cy="173" r="5" fill="#3B82F6"/>
        <line x1="210" y1="173" x2="356" y2="173" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>

        <!-- Blade 2 (Middle) -->
        <rect x="126" y="226" width="260" height="54" rx="14" fill="#241242" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.6"/>
        <circle cx="156" cy="253" r="5" fill="#10B981"/>
        <circle cx="174" cy="253" r="5" fill="#EC4899"/>
        <line x1="210" y1="253" x2="356" y2="253" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>

        <!-- Blade 3 (Bottom) -->
        <rect x="126" y="306" width="260" height="54" rx="14" fill="#241242" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.6"/>
        <circle cx="156" cy="333" r="5" fill="#10B981"/>
        <circle cx="174" cy="333" r="5" fill="#F59E0B"/>
        <line x1="210" y1="333" x2="356" y2="333" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>

        <!-- Protocol Interconnect Bus -->
        <line x1="330" y1="173" x2="330" y2="333" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
        <circle cx="330" cy="173" r="4" fill="#FFFFFF"/>
        <circle cx="330" cy="253" r="4" fill="#FFFFFF"/>
        <circle cx="330" cy="333" r="4" fill="#FFFFFF"/>
      </g>
  </g>
</svg>
