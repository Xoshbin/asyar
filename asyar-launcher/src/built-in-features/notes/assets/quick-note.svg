<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.20" />
    </filter>
    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="star-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>

  <!-- Squircle Base with Solid Color -->
  <path d="M 32 128 C 32 57.31 57.31 32 128 32 L 384 32 C 454.69 32 480 57.31 480 128 L 480 384 C 480 454.69 454.69 480 384 480 L 128 480 C 57.31 480 32 454.69 32 384 Z" fill="#D97706" />

  <!-- Content Glyph -->
  <!-- Notepad Card -->
  <g filter="url(#card-shadow)">
    <rect x="136" y="126" width="240" height="270" rx="20" fill="#FFFFFF" />
    <!-- Header banner bar -->
    <path d="M 136 146 A 20 20 0 0 1 156 126 L 356 126 A 20 20 0 0 1 376 146 L 376 170 L 136 170 Z" fill="#F59E0B" />
    <!-- Binding punch holes -->
    <circle cx="180" cy="148" r="6" fill="#78350F" />
    <circle cx="256" cy="148" r="6" fill="#78350F" />
    <circle cx="332" cy="148" r="6" fill="#78350F" />

    <!-- Dark slate ruled lines for high contrast -->
    <rect x="170" y="202" width="100" height="10" rx="5" fill="#0F172A" />
    <rect x="170" y="228" width="168" height="7" rx="3.5" fill="#94A3B8" />
    <rect x="170" y="248" width="154" height="7" rx="3.5" fill="#CBD5E1" />
    <rect x="170" y="268" width="160" height="7" rx="3.5" fill="#CBD5E1" />
    <rect x="170" y="288" width="120" height="7" rx="3.5" fill="#CBD5E1" />
  </g>

  <!-- Quick Plus Action Badge -->
  <g filter="url(#badge-shadow)">
    <circle cx="340" cy="350" r="38" fill="#0F172A" stroke="#FFFFFF" stroke-width="4.5" />
    <!-- Plus symbol in vibrant amber -->
    <path d="M 340 330 L 340 370 M 320 350 L 360 350"
          stroke="#F59E0B" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- 2px Specular Rim -->
  <path d="M 32 128 C 32 57.31 57.31 32 128 32 L 384 32 C 454.69 32 480 57.31 480 128 L 480 384 C 480 454.69 454.69 480 384 480 L 128 480 C 57.31 480 32 454.69 32 384 Z" fill="none" stroke="url(#rim-gradient)" stroke-width="2" />
</svg>