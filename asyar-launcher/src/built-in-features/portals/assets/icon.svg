<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="topSheen" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.65"/>
    </filter>
    <filter id="portalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#22D3EE" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#topSheen)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>
  <g transform="translate(-107.520 -107.520) scale(1.42)">
<g filter="url(#shadow)">
    <!-- Dimensional Event Horizon Rings -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" stroke-dasharray="240 60" filter="url(#portalGlow)"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-dasharray="160 50" transform="rotate(70 256 256)"/>
    <circle cx="256" cy="256" r="76" fill="none" stroke="#93C5FD" stroke-width="6" stroke-linecap="round" stroke-dasharray="100 40" transform="rotate(140 256 256)"/>

    <!-- Central Singularity / Gateway Core -->
    <circle cx="256" cy="256" r="38" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="24" fill="#0891B2"/>
    <circle cx="256" cy="256" r="10" fill="#E0F2FE"/>
  </g>
  </g>
