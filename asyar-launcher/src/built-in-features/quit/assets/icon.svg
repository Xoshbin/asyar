<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<!-- Background Gradient -->
    

    <!-- Specular Rim Gradient -->
    

    <!-- Top Ambient Sheen -->
    

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
      <linearGradient id="amberPower" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A"/>
        <stop offset="40%" stop-color="#F59E0B"/>
        <stop offset="100%" stop-color="#D97706"/>
      </linearGradient>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#334155"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<!-- Hero Illustration -->
  
      <!-- Apple Standby Power Symbol -->
      <g filter="url(#drop)">
        <!-- Standby Ring (Broken Circle) -->
        <path d="M 206 176 A 110 110 0 1 0 306 176" fill="none" stroke="url(#amberPower)" stroke-width="26" stroke-linecap="round"/>
        <!-- Vertical Power Stalk -->
        <line x1="256" y1="126" x2="256" y2="236" stroke="url(#amberPower)" stroke-width="26" stroke-linecap="round"/>
        <!-- Soft Core Glow Point -->
        <circle cx="256" cy="276" r="12" fill="#FDE68A" opacity="0.8"/>
      </g>
  </g>
