<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B3A44"/>
      <stop offset="100%" stop-color="#04171C"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
  </defs>

  <!-- Continuous Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>

  <!-- Top Sheen Layer -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- Specular 1px Inner Bevel -->
  <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" stroke="url(#rim)" stroke-width="1.5" fill="none"/>
  <g transform="translate(-107.520 -107.520) scale(1.42)">
<!-- Hero Illustration -->
  
      <!-- Radar Screen Circles -->
      <g stroke="#14B8A6" stroke-opacity="0.3" stroke-width="2" fill="none">
        <circle cx="256" cy="256" r="130"/>
        <circle cx="256" cy="256" r="80"/>
        <line x1="256" y1="116" x2="256" y2="396" stroke-dasharray="6 6"/>
        <line x1="116" y1="256" x2="396" y2="256" stroke-dasharray="6 6"/>
      </g>
      <!-- Dynamic EKG Waveform -->
      <g filter="url(#drop)">
        <path d="
          M 120 256
          L 186 256
          L 204 220
          L 226 296
          L 248 156
          L 272 346
          L 294 220
          L 312 272
          L 326 256
          L 392 256
        " fill="none" stroke="#5EEAD4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Activity Dot -->
        <circle cx="248" cy="156" r="8" fill="#FFFFFF"/>
        <circle cx="248" cy="156" r="14" fill="#2DD4BF" opacity="0.4"/>
      </g>
  </g>
</svg>