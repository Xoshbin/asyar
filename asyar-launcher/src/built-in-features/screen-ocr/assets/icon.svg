<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16382E"/>
      <stop offset="100%" stop-color="#081B15"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#065F46" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#065F46" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
  </defs>

  <!-- Continuous Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>

  <!-- Top Sheen Layer -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- Specular 1px Inner Bevel -->
  <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" stroke="url(#rim)" stroke-width="1.5" fill="none"/>
  <g transform="translate(-107.520 -107.520) scale(1.42)">
<!-- Hero Illustration -->
  
      <!-- Camera Reticle Frame -->
      <g filter="url(#drop)">
        <!-- Corner brackets -->
        <path d="M 140 180 L 140 146 L 174 146" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
        <path d="M 372 180 L 372 146 L 338 146" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
        <path d="M 140 332 L 140 366 L 174 366" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
        <path d="M 372 332 L 372 366 L 338 366" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>

        <!-- Text Scanning Laser Beam -->
        <line x1="130" y1="240" x2="382" y2="240" stroke="#6EE7B7" stroke-width="3" opacity="0.8"/>
        <!-- Target Character A -->
        <text x="216" y="278" font-family="-apple-system, system-ui, sans-serif" font-size="104" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
        <!-- Selection Highlight Frame -->
        <rect x="264" y="200" width="76" height="88" rx="14" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="2.5" stroke-dasharray="6 4"/>
        <text x="302" y="272" font-family="-apple-system, system-ui, sans-serif" font-size="72" font-weight="700" fill="#6EE7B7" text-anchor="middle">T</text>
      </g>
  </g>
</svg>