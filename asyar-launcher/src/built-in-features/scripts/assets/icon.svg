<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<!-- Background Gradient -->
    

    <!-- Specular Rim Gradient -->
    

    <!-- Top Ambient Sheen -->
    

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#0F172A"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<!-- Hero Illustration -->
  
      <!-- Code Terminal Window -->
      <g filter="url(#drop)">
        <rect x="116" y="136" width="280" height="240" rx="28" fill="#0C1B14" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.5"/>
        <!-- Window Titlebar -->
        <rect x="116" y="136" width="280" height="44" rx="28" fill="#132E22"/>
        <rect x="116" y="160" width="280" height="20" fill="#132E22"/>
        <!-- Window Buttons -->
        <circle cx="144" cy="158" r="6" fill="#EF4444"/>
        <circle cx="164" cy="158" r="6" fill="#F59E0B"/>
        <circle cx="184" cy="158" r="6" fill="#10B981"/>
        <!-- Terminal Prompt Chevron (❯_) -->
        <path d="M 156 220 L 186 244 L 156 268" fill="none" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Cursor Block -->
        <rect x="206" y="246" width="22" height="6" rx="2" fill="#34D399"/>
        <!-- Code syntax lines -->
        <rect x="156" y="296" width="90" height="8" rx="4" fill="#059669" opacity="0.8"/>
        <rect x="256" y="296" width="60" height="8" rx="4" fill="#34D399" opacity="0.9"/>
        <rect x="156" y="322" width="140" height="8" rx="4" fill="#047857" opacity="0.6"/>
      </g>
  </g>
</svg>
