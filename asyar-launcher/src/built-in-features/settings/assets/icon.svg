<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3342"/>
      <stop offset="100%" stop-color="#131722"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E9AAF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2D3342" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2D3342" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
      <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="35%" stop-color="#E2E8F0"/>
        <stop offset="70%" stop-color="#94A3B8"/>
        <stop offset="100%" stop-color="#64748B"/>
      </linearGradient>
      <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#334155"/>
        <stop offset="100%" stop-color="#1E293B"/>
      </linearGradient>
    
  </defs>

  <!-- Continuous Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>

  <!-- Top Sheen Layer -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- Specular 1px Inner Bevel -->
  <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" stroke="url(#rim)" stroke-width="1.5" fill="none"/>
  <g transform="translate(-107.520 -107.520) scale(1.42)">
<!-- Hero Illustration -->
  
      <!-- Main Gear -->
      <g filter="url(#drop)">
        <!-- Outer teeth -->
        <path d="
          M 256 140
          L 268 140 L 272 165 L 292 173 L 312 158 L 322 166 L 318 191 L 336 205 L 360 197 L 366 209 L 348 228 L 354 249 L 379 253 L 379 265 L 354 269 L 348 290 L 366 309 L 360 321 L 336 313 L 318 327 L 322 352 L 312 360 L 292 345 L 272 353 L 268 378 L 256 378 L 252 353 L 232 345 L 212 360 L 202 352 L 206 327 L 188 313 L 164 321 L 158 309 L 176 290 L 170 269 L 145 265 L 145 253 L 170 249 L 176 228 L 158 209 L 164 197 L 188 205 L 206 191 L 202 166 L 212 158 L 232 173 L 252 165 Z
        " fill="url(#metal)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3"/>
        <!-- Beveled rim -->
        <circle cx="256" cy="259" r="62" fill="url(#metalDark)" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
        <!-- Center hole -->
        <circle cx="256" cy="259" r="32" fill="#131722" stroke="#4A5568" stroke-width="3"/>
        <!-- Inner axle gem -->
        <circle cx="256" cy="259" r="14" fill="url(#metal)" />
      </g>
  </g>
</svg>