<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Electric Indigo to Midnight Navy -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <radialGradient id="topSheen" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#4F46E5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="keySurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F0E2A" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F0E2A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Continuous Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#topSheen)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- Sleek 3D Keycap Base (width 320, height 320, filling 72% of tile) -->
    <rect x="96" y="106" width="320" height="300" rx="54" fill="#1E1B4B" stroke="#4338CA" stroke-width="3"/>
    <rect x="110" y="116" width="292" height="270" rx="44" fill="url(#keySurface)" stroke="#6366F1" stroke-width="2"/>
    <!-- Keycap Specular Top Edge -->
    <path d="M 154 118 L 358 118 C 382 118 400 136 400 160 L 400 168 C 370 148 330 140 256 140 C 182 140 142 148 112 168 L 112 160 C 112 136 130 118 154 118 Z" fill="#FFFFFF" opacity="0.2"/>

    <!-- Mathematically Perfect Canonical Command (⌘) Symbol -->
    <g transform="translate(256 250) scale(12.5) translate(-12 -12)">
      <path d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z"
            fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>