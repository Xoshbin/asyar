<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2E1065" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#9333EA"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<g filter="url(#shadow)">
    <!-- Left Expansion Curly Bracket { -->
    <path d="M 210, 160
             C 180, 160 170, 185 170, 220
             C 170, 245 155, 256 140, 256
             C 155, 256 170, 267 170, 292
             C 170, 327 180, 352 210, 352"
          fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

    <!-- Right Expansion Curly Bracket } -->
    <path d="M 302, 160
             C 332, 160 342, 185 342, 220
             C 342, 245 357, 256 372, 256
             C 357, 256 342, 267 342, 292
             C 342, 327 332, 352 302, 352"
          fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>

    <!-- Expansion Dots in center (⚡) -->
    <circle cx="230" cy="256" r="9" fill="#E879F9"/>
    <circle cx="256" cy="256" r="11" fill="#F472B6"/>
    <circle cx="282" cy="256" r="9" fill="#E879F9"/>
  </g>
  </g>
</svg>
