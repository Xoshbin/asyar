<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.6"/>
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FDE047" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#2563EB"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<g filter="url(#shadow)">
    <!-- 4 App Modular Cubes (2x2 Grid) -->
    <!-- Top-Left -->
    <rect x="146" y="146" width="96" height="96" rx="24" fill="#FFFFFF"/>
    <circle cx="194" cy="194" r="20" fill="#3B82F6"/>

    <!-- Top-Right (Active Highlight Tile) -->
    <rect x="270" y="146" width="96" height="96" rx="24" fill="#60A5FA"/>
    <path d="M 318, 172 Q 318, 194 340, 194 Q 318, 194 318, 216 Q 318, 194 296, 194 Q 318, 194 318, 172 Z" fill="#FEF08A" filter="url(#starGlow)"/>

    <!-- Bottom-Left -->
    <rect x="146" y="270" width="96" height="96" rx="24" fill="#93C5FD"/>
    <rect x="174" y="298" width="40" height="40" rx="10" fill="#1D4ED8"/>

    <!-- Bottom-Right -->
    <rect x="270" y="270" width="96" height="96" rx="24" fill="#FFFFFF"/>
    <polygon points="318,290 338,326 298,326" fill="#2563EB"/>
  </g>
  </g>
</svg>
