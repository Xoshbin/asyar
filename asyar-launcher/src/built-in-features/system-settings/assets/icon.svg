<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<!-- Background Gradient -->
    

    <!-- Specular Rim Gradient -->
    

    <!-- Top Ambient Sheen -->
    

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#475569"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<!-- Hero Illustration -->
  
      <!-- Sliders Control Center -->
      <g filter="url(#drop)">
        <!-- Track 1 (Top) -->
        <line x1="146" y1="180" x2="366" y2="180" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
        <line x1="146" y1="180" x2="246" y2="180" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
        <circle cx="246" cy="180" r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/>

        <!-- Track 2 (Middle) -->
        <line x1="146" y1="256" x2="366" y2="256" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
        <line x1="146" y1="256" x2="316" y2="256" stroke="#60A5FA" stroke-width="8" stroke-linecap="round"/>
        <circle cx="316" cy="256" r="18" fill="#FFFFFF" stroke="#60A5FA" stroke-width="4"/>

        <!-- Track 3 (Bottom) -->
        <line x1="146" y1="332" x2="366" y2="332" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
        <line x1="146" y1="332" x2="206" y2="332" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
        <circle cx="206" cy="332" r="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/>
      </g>
  </g>
</svg>
