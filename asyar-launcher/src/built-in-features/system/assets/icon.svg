<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<!-- Background Gradient: Deep Slate Obsidian -->
    

    

    

    <!-- Display Aluminum & Screen Gradients -->
    <linearGradient id="aluminum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="screenSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#334155"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- Stand Neck & Base -->
    <path d="M 234 316 L 230 380 L 282 380 L 278 316 Z" fill="url(#aluminum)"/>
    <rect x="186" y="378" width="140" height="16" rx="8" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>

    <!-- Display Bezel Outer (width 336, height 226) -->
    <rect x="88" y="100" width="336" height="224" rx="24" fill="url(#aluminum)" stroke="#94A3B8" stroke-width="2"/>
    <!-- Glass Inner Screen -->
    <rect x="100" y="112" width="312" height="182" rx="14" fill="url(#screenGlass)"/>
    <rect x="100" y="112" width="312" height="182" rx="14" fill="url(#screenSheen)"/>

    <!-- Screen Content: Glowing System Power / Standby Symbol inside display -->
    <g transform="translate(256 203) scale(4.8) translate(-12 -12)">
      <path d="M 18.36 6.64 A 9 9 0 1 1 5.64 6.64" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="12" y1="2" x2="12" y2="12" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Bottom Chin Apple-style Indicator Dot -->
    <circle cx="256" cy="306" r="4" fill="#94A3B8"/>
  </g>
</svg>
