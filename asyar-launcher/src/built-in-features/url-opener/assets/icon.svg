<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#026A9C"/>
      <stop offset="100%" stop-color="#032C42"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
  </defs>

  <!-- Continuous Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>

  <!-- Top Sheen Layer -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- Specular 1px Inner Bevel -->
  <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" stroke="url(#rim)" stroke-width="1.5" fill="none"/>
  <g transform="translate(-107.520 -107.520) scale(1.42)">
<!-- Hero Illustration -->
  
      <!-- Wireframe Globe -->
      <g filter="url(#drop)">
        <circle cx="240" cy="266" r="106" fill="#043854" stroke="#38BDF8" stroke-width="3"/>
        <ellipse cx="240" cy="266" rx="46" ry="106" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.8"/>
        <line x1="134" y1="266" x2="346" y2="266" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.8"/>
        <line x1="154" y1="216" x2="326" y2="216" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5"/>
        <line x1="154" y1="316" x2="326" y2="316" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5"/>

        <!-- Outbound Launch Arrow -->
        <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <line x1="286" y1="220" x2="376" y2="130" stroke="#38BDF8"/>
          <path d="M 306 130 L 376 130 L 376 200" fill="none"/>
        </g>
        <circle cx="376" cy="130" r="8" fill="#FFFFFF"/>
      </g>
  </g>
</svg>