<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 32 448 448" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3066"/>
      <stop offset="100%" stop-color="#0B1533"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top Ambient Sheen -->
    <radialGradient id="sheen" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
      <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#1D4ED8"/>
      </linearGradient>
      <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/>
      </linearGradient>
      <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#3B82F6"/>
      </linearGradient>
      <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#BFDBFE"/><stop offset="100%" stop-color="#60A5FA"/>
      </linearGradient>
    
  </defs>

  <!-- Continuous Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)"/>

  <!-- Top Sheen Layer -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#sheen)"/>

  <!-- Specular 1px Inner Bevel -->
  <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" stroke="url(#rim)" stroke-width="1.5" fill="none"/>
  <g transform="translate(-107.520 -107.520) scale(1.42)">
<!-- Hero Illustration -->
  
      <!-- 3D Ascending Metric Histogram Bars -->
      <g filter="url(#drop)">
        <!-- Bar 1 (Left, Short) -->
        <rect x="136" y="296" width="48" height="80" rx="12" fill="url(#bar1)" stroke="#60A5FA" stroke-width="1.5"/>
        <!-- Bar 2 (Mid-Left) -->
        <rect x="198" y="236" width="48" height="140" rx="12" fill="url(#bar2)" stroke="#60A5FA" stroke-width="1.5"/>
        <!-- Bar 3 (Mid-Right) -->
        <rect x="260" y="196" width="48" height="180" rx="12" fill="url(#bar3)" stroke="#60A5FA" stroke-width="1.5"/>
        <!-- Bar 4 (Right, Tall) -->
        <rect x="322" y="146" width="48" height="230" rx="12" fill="url(#bar4)" stroke="#93C5FD" stroke-width="2"/>

        <!-- Upward Trend Line & Nodes -->
        <path d="M 160 270 Q 220 220 284 170 T 346 120" fill="none" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
        <circle cx="160" cy="270" r="6" fill="#FDE047"/>
        <circle cx="284" cy="170" r="6" fill="#FDE047"/>
        <circle cx="346" cy="120" r="8" fill="#FFFFFF" stroke="#EAB308" stroke-width="3"/>
      </g>
  </g>
</svg>