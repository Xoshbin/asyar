<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
<!-- Background Gradient -->
    

    <!-- Specular Rim Gradient -->
    

    <!-- Top Ambient Sheen -->
    

    <!-- Hero Drop Shadow -->
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    
      <linearGradient id="goldStar" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFF3B0"/>
        <stop offset="40%" stop-color="#FFD166"/>
        <stop offset="100%" stop-color="#FF9F1C"/>
      </linearGradient>
  </defs>

  <!-- Solid Flat Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#7C3AED"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>

  <g transform="translate(-38.4 -38.4) scale(1.15)">
<!-- Hero Illustration -->
  
      <!-- Radiant Burst Behind Star -->
      <g opacity="0.4" filter="url(#drop)">
        <line x1="256" y1="110" x2="256" y2="400" stroke="#FFD166" stroke-width="2" stroke-dasharray="8 8"/>
        <line x1="110" y1="256" x2="400" y2="256" stroke="#FFD166" stroke-width="2" stroke-dasharray="8 8"/>
        <line x1="150" y1="150" x2="360" y2="360" stroke="#FFD166" stroke-width="2" stroke-dasharray="8 8"/>
        <line x1="360" y1="150" x2="150" y2="360" stroke="#FFD166" stroke-width="2" stroke-dasharray="8 8"/>
      </g>
      <!-- Hero Star -->
      <g filter="url(#drop)">
        <polygon points="256,132 291,215 380,223 313,281 333,368 256,322 179,368 199,281 132,223 221,215" fill="url(#goldStar)" stroke="#FFF8E7" stroke-width="3"/>
        <!-- Star Facets -->
        <polygon points="256,132 256,322 179,368 199,281 132,223 221,215" fill="#FFA500" opacity="0.25"/>
        <!-- Center Gem -->
        <circle cx="256" cy="256" r="12" fill="#FFFFFF" opacity="0.9"/>
      </g>
      <!-- Satellite Sparkles -->
      <path d="M 360 140 Q 360 155 375 155 Q 360 155 360 170 Q 360 155 345 155 Q 360 155 360 140 Z" fill="#FFEAA7" filter="url(#drop)"/>
      <path d="M 150 330 Q 150 342 162 342 Q 150 342 150 354 Q 150 342 138 342 Q 150 342 150 330 Z" fill="#FFEAA7" filter="url(#drop)"/>
      <circle cx="140" cy="180" r="4" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="370" cy="320" r="5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
