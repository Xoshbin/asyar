<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.20" />
    </filter>
    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="star-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
  </defs>

  <!-- Squircle Base with Solid Color -->
  <path d="M 32 128 C 32 57.31 57.31 32 128 32 L 384 32 C 454.69 32 480 57.31 480 128 L 480 384 C 480 454.69 454.69 480 384 480 L 128 480 C 57.31 480 32 454.69 32 384 Z" fill="#0284C7" />

  <!-- Content Glyph -->
  <!-- Window Frame to be saved -->
  <g filter="url(#card-shadow)">
    <rect x="126" y="140" width="260" height="196" rx="18" fill="#FFFFFF" />
    <!-- Titlebar -->
    <rect x="126" y="140" width="260" height="34" rx="18" fill="#F1F5F9" />
    <circle cx="148" cy="157" r="5" fill="#EF4444" />
    <circle cx="162" cy="157" r="5" fill="#F59E0B" />
    <circle cx="176" cy="157" r="5" fill="#10B981" />

    <!-- Blueprint Grid Guide / Layout Geometry -->
    <rect x="146" y="192" width="104" height="124" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="6 4" />
    <rect x="262" y="192" width="104" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
    <rect x="262" y="260" width="104" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
  </g>

  <!-- Floating Save / Plus Badge -->
  <g filter="url(#badge-shadow)">
    <circle cx="360" cy="336" r="36" fill="#059669" stroke="#FFFFFF" stroke-width="4" />
    <!-- Plus symbol -->
    <path d="M 360 318 L 360 354 M 342 336 L 378 336"
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 2px Specular Rim -->
  <path d="M 32 128 C 32 57.31 57.31 32 128 32 L 384 32 C 454.69 32 480 57.31 480 128 L 480 384 C 480 454.69 454.69 480 384 480 L 128 480 C 57.31 480 32 454.69 32 384 Z" fill="none" stroke="url(#rim-gradient)" stroke-width="2" />
</svg>