packages:
  - 'asyar-launcher'
  - 'asyar-sdk'
  - 'extensions/*'
  - 'asyar-launcher/src/extensions/*'

allowBuilds:
  esbuild: true
  keytar: true

supportedArchitectures:
  cpu:
    - 'arm64'
    - 'x64'
  os:
    - 'win32'
    - 'darwin'
    - 'linux'

overrides:
  vite: '6.4.3'
  asyar-sdk: 'workspace:*'
  vitest: '^4.1.10'
  '@vitest/coverage-v8': '^4.1.10'
  rollup: '>=4.40.0'
  nanoid: '>=3.3.18'
  brace-expansion: '>=5.0.9'
  js-yaml: '>=4.3.1'
  cookie: '>=0.7.0'
  postcss: '>=8.5.23'
  tmp: '>=0.2.6'
  jsdom: '^30.0.1'
